version: 2.1

# HealthInfo Android CI Pipeline
# Runs on every push to master/main and all pull requests.
# Pipeline steps: unit tests → lint analysis → build debug APK

jobs:
  build:
    docker:
      - image: cimg/android:2024.07.1
    resource_class: large
    working_directory: ~/project
    environment:
      # Disable Gradle daemon for CI (fresh container each run)
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.incremental=false -Dorg.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64"
      JVM_OPTS: "-Xmx3200m"

    steps:
      - checkout

      - run:
          name: Set Java 17 (override default JDK 21)
          command: |
            echo "export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $BASH_ENV
            echo "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH" >> $BASH_ENV
            source $BASH_ENV
            java -version

      - run:
          name: Create local.properties
          command: |
            echo "API_KEY=${API_KEY}" > local.properties
            echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
            # Remove Windows-specific JDK path from gradle.properties (CI uses JAVA_HOME instead)
            sed -i '/org.gradle.java.home/d' gradle.properties

      - run:
          name: Grant execute permission for gradlew
          command: chmod +x ./gradlew

      # Restore Gradle dependency cache
      - restore_cache:
          keys:
            - gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "core/build.gradle.kts" }}
            - gradle-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-

      - run:
          name: Download dependencies
          command: ./gradlew dependencies --no-daemon

      - run:
          name: Run unit tests
          command: ./gradlew :app:testDebugUnitTest :core:testDebugUnitTest --no-daemon --continue

      - run:
          name: Run lint analysis
          command: ./gradlew :app:lint :core:lint --no-daemon

      - run:
          name: Build debug APK
          command: ./gradlew assembleDebug --no-daemon

      # Save Gradle dependency cache
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-{{ checksum "gradle/libs.versions.toml" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "core/build.gradle.kts" }}

      # Store APK as artifact (dapat didownload dari CircleCI dashboard)
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

      # Store lint reports
      - store_artifacts:
          path: app/build/reports
          destination: lint-report-app

      - store_artifacts:
          path: core/build/reports
          destination: lint-report-core

      - store_artifacts:
          path: favorite/build/reports
          destination: lint-report-favorite

      # Store test results (ditampilkan di tab "Tests" CircleCI)
      - store_test_results:
          path: app/build/test-results/testDebugUnitTest

      - store_test_results:
          path: core/build/test-results/testDebugUnitTest

workflows:
  build-and-test:
    jobs:
      - build
